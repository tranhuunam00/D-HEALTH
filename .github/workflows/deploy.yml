name: D-HEALTH Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Kiểm tra thông tin bí mật máy chủ (SSH Secrets)
        id: check_secrets
        run: |
          if [ -n "${{ secrets.SERVER_PASSWORD }}" ] || [ -n "${{ secrets.PASSWORD }}" ] || [ -n "${{ secrets.SERVER_PASS }}" ] || [ -n "${{ secrets.SERVER_SSH_KEY }}" ] || [ -n "${{ secrets.SSH_KEY }}" ]; then
            echo "has_secret=true" >> $GITHUB_OUTPUT
            echo "✓ Đã tìm thấy SSH Secret để kết nối máy chủ."
          else
            echo "has_secret=false" >> $GITHUB_OUTPUT
            echo "⚠️ [CHÚ Ý] Chưa cấu hình 'SERVER_PASSWORD' hoặc 'SERVER_SSH_KEY' trên GitHub Repository Secrets."
            echo "👉 Để tự động deploy qua GitHub Actions:"
            echo "   1. Vào repo GitHub -> Settings -> Secrets and variables -> Actions"
            echo "   2. Thêm secret: SERVER_PASSWORD = <mật khẩu VPS 103.90.227.173>"
          fi

      - name: Thực thi triển khai từ xa qua SSH
        if: steps.check_secrets.outputs.has_secret == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '103.90.227.173' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Bắt đầu cập nhật D-HEALTH trên máy chủ..."
            
            # 1. Điều hướng vào thư mục dự án hoặc clone mới nếu chưa có
            if [ -d ~/D-HEALTH ]; then
              cd ~/D-HEALTH
            elif [ -d /root/D-HEALTH ]; then
              cd /root/D-HEALTH
            else
              echo "Thư mục dự án chưa tồn tại, đang clone từ GitHub..."
              cd ~
              git clone https://github.com/tranhuunam00/D-HEALTH.git D-HEALTH
              cd D-HEALTH
            fi

            # 2. Kéo mã nguồn mới nhất từ nhánh main
            git reset --hard
            git pull origin main

            # 3. Đảm bảo có file .env
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # 4. DỪNG VÀ CLEAR TRIỆT ĐỂ CONTAINER CŨ TRƯỚC KHI CHẠY MỚI
            echo "🧹 [1/3] Dừng và xoá sạch các container, orphan containers cũ..."
            docker compose down --remove-orphans || true
            
            # Xoá cưỡng chế nếu container còn bị kẹt tiến trình
            docker rm -f dhealth-frontend dhealth-backend dhealth-postgres dhealth-minio dhealth-minio-init 2>/dev/null || true

            # 5. BUILD VÀ KHỞI ĐỘNG CÁC CONTAINER MỚI
            echo "🔨 [2/3] Build và khởi động lại toàn bộ Docker Stack..."
            docker compose up -d --build --force-recreate

            # 6. DỌN DẸP DỮ LIỆU RÁC (DANGLING IMAGES) SAU KHI BUILD ĐỂ TIẾT KIỆM Ổ CỨNG
            echo "🧹 [3/3] Dọn dẹp images cũ và cache không còn sử dụng..."
            docker image prune -f || true

            # 7. KIỂM TRA TRẠNG THÁI CUỐI CÙNG
            echo "📊 Trạng thái các container đang chạy:"
            docker compose ps

            echo "🎉 [CI/CD] Triển khai thành công phiên bản mới D-HEALTH lên Server!"
            echo "🌐 Frontend: http://103.90.227.173:7101 hoặc https://dhealth.home-care.vn"
            echo "🌐 Backend:  http://103.90.227.173:7102/api/health"
            echo "🌐 MinIO:    http://103.90.227.173:7105 (Console)"
