name: D-HEALTH Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Thực thi triển khai từ xa qua SSH bằng Mật khẩu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '103.90.227.173' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Bắt đầu cập nhật D-HEALTH trên máy chủ..."
            
            # 1. Kiểm tra nếu thư mục D-HEALTH chưa tồn tại trên VPS thì clone về
            if [ ! -d ~/D-HEALTH ] && [ ! -d /root/D-HEALTH ]; then
              echo "Cloning repository..."
              cd ~
              git clone https://github.com/tranhuunam00/D-HEALTH.git D-HEALTH
            fi

            # 2. Di chuyển vào thư mục dự án
            if [ -d ~/D-HEALTH ]; then
              cd ~/D-HEALTH
            else
              cd /root/D-HEALTH
            fi

            # 3. Kéo mã nguồn mới nhất từ nhánh main
            git reset --hard
            git pull origin main

            # 4. Đảm bảo có file .env
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # 5. DỪNG VÀ CLEAR TRIỆT ĐỂ CONTAINER CŨ TRƯỚC KHI CHẠY MỚI
            echo "🧹 [1/3] Dừng và xoá sạch các container, orphan containers cũ..."
            docker compose down --remove-orphans || true
            
            # Xoá cưỡng chế nếu container còn bị kẹt tiến trình
            docker rm -f dhealth-frontend dhealth-backend dhealth-postgres dhealth-minio dhealth-minio-init 2>/dev/null || true

            # 6. BUILD VÀ KHỞI ĐỘNG CÁC CONTAINER MỚI
            echo "🔨 [2/3] Build và khởi động lại toàn bộ Docker Stack..."
            docker compose up -d --build --force-recreate

            # 7. DỌN DẸP DỮ LIỆU RÁC (DANGLING IMAGES) SAU KHI BUILD ĐỂ TIẾT KIỆM Ổ CỨNG
            echo "🧹 [3/3] Dọn dẹp images cũ và cache không còn sử dụng..."
            docker image prune -f || true

            # 8. KIỂM TRA TRẠNG THÁI CUỐI CÙNG
            echo "📊 Trạng thái các container đang chạy:"
            docker compose ps

            echo "🎉 [CI/CD] Triển khai thành công phiên bản mới D-HEALTH lên Server!"
            echo "🌐 Frontend: http://103.90.227.173:7001 hoặc https://dhealth.home-care.vn"
            echo "🌐 Backend:  http://103.90.227.173:7002/api/health"
            echo "🌐 MinIO:    http://103.90.227.173:7005 (Console)"
