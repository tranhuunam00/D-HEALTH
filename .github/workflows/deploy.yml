name: D-HEALTH Auto Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch: # Cho phép bấm nút kích hoạt thủ công từ giao diện GitHub Actions

jobs:
  # -------------------------------------------------------------
  # Tự động Deploy trực tiếp lên VPS Server qua SSH
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Thực thi triển khai từ xa qua SSH bằng Mật khẩu
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || '103.90.227.173' }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.PASSWORD || secrets.SERVER_PASS }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          timeout: 60s
          command_timeout: 30m
          script_stop: true
          script: |
            echo "🚀 [CI/CD] Bắt đầu cập nhật D-HEALTH trên máy chủ..."
            
            # Kiểm tra nếu thư mục D-HEALTH chưa tồn tại trên VPS thì clone về
            if [ ! -d "~/D-HEALTH" ] && [ ! -d "/root/D-HEALTH" ]; then
              echo "Cloning repository..."
              cd ~
              git clone https://github.com/tranhuunam00/D-HEALTH.git D-HEALTH
            fi

            # Di chuyển vào thư mục dự án
            if [ -d "~/D-HEALTH" ]; then
              cd ~/D-HEALTH
            else
              cd /root/D-HEALTH
            fi

            # Kéo mã nguồn mới nhất từ nhánh main
            git pull origin main

            # Đảm bảo có file .env
            if [ ! -f .env ]; then
              cp .env.example .env
            fi

            # Tái tạo và khởi động lại toàn bộ Docker Stack
            docker compose down
            docker compose up -d --build --force-recreate

            # Kiểm tra trạng thái các container
            docker compose ps

            echo "🎉 [CI/CD] Triển khai thành công phiên bản mới D-HEALTH lên Server!"
            echo "🌐 Truy cập tại: https://dhealth.home-care.vn"
