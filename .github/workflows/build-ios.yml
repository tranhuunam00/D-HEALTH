name: Build iOS IPA Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'

jobs:
  build-ios:
    name: Build iOS IPA without local Mac
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Web Application
        run: |
          cd frontend
          npm run build

      - name: Sync Capacitor iOS
        run: |
          cd frontend
          npx cap sync ios

      - name: Build Xcode Archive
        run: |
          cd frontend/ios/App
          xcodebuild clean archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package .IPA File
        run: |
          cd frontend/ios/App/build
          mkdir -p Payload
          cp -r App.xcarchive/Products/Applications/App.app Payload/
          zip -qr D-Health-unsigned.ipa Payload
          mv D-Health-unsigned.ipa ../../../../D-Health-unsigned.ipa

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: D-Health-iOS-IPA
          path: D-Health-unsigned.ipa
          retention-days: 14
