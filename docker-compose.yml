services:
  # -------------------------------------------------------------
  # 1. Cơ sở dữ liệu tập trung (PostgreSQL 16)
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dhealth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dhealth_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dhealth_secret_2026}
      POSTGRES_DB: ${DB_NAME:-dhealth_db}
    ports:
      - "${DB_PORT:-7103}:5432"
    volumes:
      - dhealth-pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dhealth_user} -d ${DB_NAME:-dhealth_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dhealth-net

  # -------------------------------------------------------------
  # 2. Kho lưu trữ tệp y tế S3 (MinIO Object Storage)
  # -------------------------------------------------------------
  minio:
    image: quay.io/minio/minio:latest
    container_name: dhealth-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-dhealth_minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-dhealth_minio_secret_2026}
    ports:
      - "${MINIO_PORT:-7104}:9000"         # S3 API
      - "${MINIO_CONSOLE_PORT:-7105}:9001" # Web Admin Console
    volumes:
      - dhealth-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dhealth-net

  # -------------------------------------------------------------
  # 3. D-Health Backend API (Node.js Express / Clean Architecture)
  # -------------------------------------------------------------
  backend:
    container_name: dhealth-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dhealth_user}
      DB_PASSWORD: ${DB_PASSWORD:-dhealth_secret_2026}
      DB_NAME: ${DB_NAME:-dhealth_db}
      DATABASE_URL: postgresql://${DB_USER:-dhealth_user}:${DB_PASSWORD:-dhealth_secret_2026}@postgres:5432/${DB_NAME:-dhealth_db}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-dhealth_minio_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-dhealth_minio_secret_2026}
      MINIO_USE_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-dhealth_jwt_super_secret_2026}
      GOOGLE_MAILER_CLIENT_ID: ${GOOGLE_MAILER_CLIENT_ID:-}
      GOOGLE_MAILER_CLIENT_SECRET: ${GOOGLE_MAILER_CLIENT_SECRET:-}
      GOOGLE_MAILER_REFRESH_TOKEN: ${GOOGLE_MAILER_REFRESH_TOKEN:-}
      ADMIN_EMAIL_ADDRESS: ${ADMIN_EMAIL_ADDRESS:-}
    ports:
      - "${BACKEND_PORT:-7102}:5000"
    networks:
      - dhealth-net

  # -------------------------------------------------------------
  # 4. D-Health Frontend Web / Mobile Client (Nginx + React SPA)
  # -------------------------------------------------------------
  frontend:
    container_name: dhealth-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-7101}:80"
    networks:
      - dhealth-net

volumes:
  dhealth-pgdata:
    driver: local
  dhealth-minio-data:
    driver: local

networks:
  dhealth-net:
    driver: bridge
