# ====================================================================
# Cấu hình Nginx Reverse Proxy cho D-HEALTH
# Domain: dhealth.home-care.vn
# Upstream: Frontend Web/Mobile Container (Port 7101)
# ====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name dhealth.home-care.vn;

    # Cho phép upload ảnh xét nghiệm, file DICOM và tài liệu y khoa dung lượng lớn
    client_max_body_size 100M;
    client_body_timeout 120s;
    send_timeout 120s;

    # Nhật ký truy cập
    access_log /var/log/nginx/dhealth_access.log;
    error_log /var/log/nginx/dhealth_error.log;

    # Chuyển tiếp toàn bộ request vào Frontend container (Port 7101)
    # Nginx nội bộ của frontend container sẽ tự reverse-proxy /api/* vào Backend và /s3/* vào MinIO
    location / {
        proxy_pass http://127.0.0.1:7101;
        proxy_http_version 1.1;

        # Hỗ trợ WebSockets & Server-Sent Events (SSE) cho Realtime Biometrics
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded Headers phục vụ xác thực và định danh IP
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Cấu hình timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering off;
    }
}
